# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# - PHP image with dependencies baked in (no source bind mounts)
# - Nginx image with the built SPA
# - No Vite dev server, no published MySQL port

x-backend-prod: &backend-prod
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: eversoft-crm/backend:${IMAGE_TAG:-latest}
  volumes: !override
    - backend-storage:/var/www/backend/storage

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: prod
    image: eversoft-crm/nginx:${IMAGE_TAG:-latest}
    ports: !override
      - "${APP_PORT:-80}:80"
      - "${APP_TLS_PORT:-443}:443"
    volumes: !override
      - backend-storage:/var/www/backend/storage:ro
      # - ./certs:/etc/nginx/certs:ro

  backend:
    <<: *backend-prod
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CONTAINER_ROLE: app
      AUTO_MIGRATE: "true"

  queue:
    <<: *backend-prod

  scheduler:
    <<: *backend-prod

  frontend:
    profiles: ["dev-only"]

  mysql:
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eversoft_crm}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME to a dedicated user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: !reset []

volumes:
  backend-storage:
