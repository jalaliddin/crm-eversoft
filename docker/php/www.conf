[www]
; Only reachable inside the compose network; Nginx is the single public entry point.
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
