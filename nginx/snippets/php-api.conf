# Laravel API. PHP-FPM is reachable only on the internal Docker network.
location ^~ /api/ {
    root /var/www/backend/public;
    try_files $uri /index.php?$query_string;
}

location ^~ /up {
    root /var/www/backend/public;
    try_files $uri /index.php?$query_string;
}

# Public uploads (avatars, logos, employee photos). Private documents are served by the API only.
location ^~ /storage/ {
    alias /var/www/backend/storage/app/public/;
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
    location ~* \.(php|phtml|phar)$ { deny all; }
}

location = /index.php {
    root /var/www/backend/public;
    # Logging is decided here (after the internal redirect). Terminal push URLs carry a secret token,
    # so they are not written to the access log; the app records each push in the device push log instead.
    access_log /var/log/nginx/access.log main if=$loggable_request;
    # Re-resolve the container name so a recreated backend container is picked up without an Nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream backend:9000;
    fastcgi_pass $php_upstream;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_scheme;
    fastcgi_param HTTPS $fastcgi_https if_not_empty;
    fastcgi_read_timeout 120s;
    # Nginx adds the security headers for every response; drop Laravel's copies to avoid duplicates.
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Permissions-Policy;
    fastcgi_hide_header Cross-Origin-Opener-Policy;
    fastcgi_hide_header X-Powered-By;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    internal;
}

# Never serve other PHP files or dotfiles.
location ~ \.php$ { return 404; }
location ~ /\.(?!well-known) { deny all; }
