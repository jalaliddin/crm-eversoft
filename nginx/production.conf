# Production: crm.eversoft.uz and tenant subdomains (*.crm.eversoft.uz).
# /      → built React SPA (static, long-cached hashed assets)
# /api   → Laravel via PHP-FPM (internal network only)
map $http_x_forwarded_proto $forwarded_scheme { default $http_x_forwarded_proto; "" $scheme; }
map $forwarded_scheme $fastcgi_https { https on; default ""; }

server {
    listen 80;
    server_name crm.eversoft.uz *.crm.eversoft.uz _;
    client_max_body_size 26m;
    server_tokens off;

    # When TLS terminates here, redirect HTTP → HTTPS instead of serving:
    # return 301 https://$host$request_uri;

    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;
    include /etc/nginx/snippets/php-api.conf;

    root /usr/share/nginx/html;

    # Fingerprinted build assets: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # SPA routing: unknown paths render the app.
    location / {
        try_files $uri /index.html;
    }
}

