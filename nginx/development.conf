# Development: React from the Vite dev server (hot reload), /api to Laravel.
map $http_x_forwarded_proto $forwarded_scheme { default $http_x_forwarded_proto; "" $scheme; }
map $forwarded_scheme $fastcgi_https { https on; default ""; }
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 26m;
    server_tokens off;

    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/php-api.conf;

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
